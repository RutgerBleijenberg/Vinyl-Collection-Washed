<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vinyl Collectie"><link rel="apple-touch-icon" sizes="180x180" href="icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon.png"><title>Vinyl Collectie</title><style>
:root{color-scheme:dark;--bg:#0b0c0f;--card:#15171c;--card2:#1c1f26;--text:#f5f6f8;--muted:#9ca3af;--line:#2a2e38;--accent:#e6b85c;--danger:#e06b6b;--green:#7fd19a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;max-width:900px;margin:auto;padding-bottom:100px}header{position:sticky;top:0;z-index:5;background:rgba(11,12,15,.96);backdrop-filter:blur(14px);padding:18px 16px 14px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}.add{background:var(--accent);color:#111;border:0;border-radius:14px;padding:11px 14px;font-weight:800}.stats{display:flex;gap:8px;margin-top:14px;overflow:auto}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-width:88px}.stat b{display:block;font-size:18px}.stat span{color:var(--muted);font-size:11px}.controls{padding:14px 16px 4px;display:grid;grid-template-columns:1fr auto;gap:9px}input,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}.list{padding:10px 16px;display:grid;gap:9px}.record{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center}.disc{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#20242d 0 8%,#050609 9% 35%,#171a20 36% 39%,#050609 40% 100%);box-shadow:0 0 0 2px #2b2e36}.title{font-weight:750;line-height:1.2}.artist{color:var(--muted);font-size:13px;margin-top:3px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:#cfd3dc}.washed{color:var(--green)}.actions{display:flex;gap:6px}.icon{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;width:40px;height:40px}.icon.delete{color:var(--danger)}.empty{padding:35px 20px;text-align:center;color:var(--muted)}.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);font-size:28px;box-shadow:0 8px 30px #0008;z-index:6}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:#15171c;border:1px solid var(--line);width:100%;max-width:600px;margin:auto;border-radius:22px 22px 0 0;padding:20px 16px 28px}.sheet h2{margin:0 0 15px}.grid{display:grid;gap:11px}label{font-size:12px;color:var(--muted)}label input,label select{display:block;width:100%;margin-top:5px}.modal-actions{display:flex;gap:9px;margin-top:16px}.modal-actions button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-weight:700}.modal-actions .save{background:var(--accent);color:#111;border-color:var(--accent)}@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:22px}.list{grid-template-columns:1fr 1fr}}
</style>
