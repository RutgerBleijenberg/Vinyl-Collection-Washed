<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Mijn Vinyl Collectie</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f6;color:#18181b}header{background:#18181b;color:white;padding:24px 18px 18px;position:sticky;top:0;z-index:5}h1{margin:0 0 14px;font-size:25px}.bar{display:flex;gap:8px}.bar input{flex:1;padding:12px 14px;border:0;border-radius:12px;font-size:16px}.add{background:#e5e7eb;color:#111;border:0;border-radius:12px;padding:0 15px;font-size:22px}.filters{display:flex;gap:7px;overflow:auto;padding:12px 16px;background:white}.filters button{white-space:nowrap;border:1px solid #ddd;background:white;border-radius:20px;padding:8px 13px}.filters button.active{background:#18181b;color:white}.count{padding:10px 16px;color:#666;font-size:14px}.list{padding:0 12px 90px}.card{background:white;border-radius:15px;margin:8px 0;padding:15px;box-shadow:0 1px 4px #00000010;display:flex;align-items:center;gap:12px}.info{flex:1;min-width:0}.artist{font-weight:700}.title{margin-top:3px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#888;margin-top:7px}.actions{display:flex;gap:5px}.actions button{border:0;background:#f0f0f2;border-radius:10px;width:38px;height:38px;font-size:17px}.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:50%;background:#18181b;color:white;font-size:30px;box-shadow:0 5px 18px #0003}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.show{display:flex}.sheet{background:white;width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.sheet label{display:block;font-size:13px;color:#666;margin:12px 0 5px}.sheet input,.sheet select{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:16px}.row{display:flex;gap:9px;margin-top:18px}.row button{flex:1;padding:13px;border:0;border-radius:11px;font-size:16px}.save{background:#18181b;color:white}.cancel{background:#eee}@media(min-width:700px){.list{max-width:800px;margin:auto}.filters{justify-content:center}.modal{align-items:center}.sheet{max-width:500px;border-radius:20px}}
</style></head><body><header><h1>🎵 Mijn Vinyl Collectie</h1><div class="bar"><input id="search" placeholder="Zoek artiest of titel…"><button class="add" onclick="openForm()">＋</button></div></header><div class="filters" id="filters"></div><div class="count" id="count"></div><main class="list" id="list"></main><button class="fab" onclick="openForm()">＋</button><div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><h2 id="formTitle">Plaat toevoegen</h2><input type="hidden" id="editId"><label>Artiest</label><input id="artist"><label>Titel</label><input id="title"><label>Formaat</label><select id="format"><option>LP</option><option>2LP</option><option>3LP</option><option>4LP</option><option>6LP</option><option>12&quot;</option><option>RSD</option><option>New</option></select><label>Gewassen?</label><select id="washed"><option value="Ja">Ja</option><option value="Nee">Nee</option></select><div class="row"><button class="cancel" onclick="closeForm()">Annuleren</button><button class="save" onclick="saveRecord()">Opslaan</button></div></div></div><script>
const initial=[
['Jamiroquai','High Times','2LP'],['Brand New Heavies','Best Of','2LP'],['Depeche Mode','Violator','LP'],['Purple Disco Machine','Paradise','LP'],['','Dance Classics Volume 1','New'],['','Turn Up the Bass Volume 2','LP'],['Talk Talk',"It's My Life Remastered",'LP'],['Sade','Best of','2LP'],['Michael Jackson','Bad','LP'],['','Dance Classics Volume 2','New'],['Pet Shop Boys','Smash','6LP'],['Michael Jackson','Thriller','LP'],['Michael Jackson','Off the Wall','LP'],['Michael Jackson','Dangerous','LP'],['Prince','Diamonds & Pearls','4LP'],['','Movie Hits 80s Collected','2LP'],['Jamiroquai','A Funk Odyssey RSD','RSD'],['Fleetwood Mac','Tango in the Night','LP'],['Chic','Chic-ism','LP'],['','High Fashion Dance Music Volume 5','LP'],['','50 Years Soul Show','2LP'],['Duran Duran','Greatest','2LP'],['Time Bandits','Greatest Hits','2LP'],['Fun Fun','Greatest Fun','LP'],['Timmy T','Time After Time','LP'],['Alexander O’Neal','Fake 12”','12"'],['Derek B','Good Groove 12”','12"'],['Alyson Williams','Cooked remix lp','LP'],['Sugarhill Gang','rappers delight 12”','12"'],['','Now Dance The 80s','3LP'],['Change','Paradise Ultimate coll','2LP'],['Madonna','Celebration','4LP'],['Kraak & Smaak','Velvet Seas','2LP'],['Hall & Oates','Ultimate Collection','LP'],['Phil Collins','12”ers RSD','12"'],['Faithless','Insomnia 12” RSD','12"'],['Toto','Their Ultimate Collection','LP'],['Pet Shop Boys','Introspective 2018','LP'],['UB40','The Very Best Of','LP'],['Stereo MC’S','Connected','LP'],['','Dance Masters Shep Pettibone','2LP'],['Kraak & Smaak','Twenty','2LP'],['Deee-lite','The very best of','2LP'],['','80s 12inch remixes collected','3LP'],['','12”/80s original 12” mixes','3LP'],['Tony Scott','The Chief','2LP'],['Daft punk','Random Access Memory','LP'],['Janet Jackson','Control the remixes','LP'],['Level 42','Collected','LP'],['De La Soul','3 Feet High and Rising','LP'],['Michael Jackson','Number Ones','LP'],['Jamiroquai','Automaton','LP'],['Fleetwood Mac','Greatest Hits','LP'],['','90s Dance Anthems','2LP'],['The Police','Greatest Hits','LP'],['Electronic','Electronic','LP'],['Madonna','Confessions on a dancefl','LP']];
let records=JSON.parse(localStorage.getItem('vinylRecords')||'null')||initial.map((x,i)=>({id:Date.now()+i,artist:x[0],title:x[1],format:x[2],washed:'Ja'}));let filter='Alles';
function persist(){localStorage.setItem('vinylRecords',JSON.stringify(records))}function render(){let q=document.getElementById('search').value.toLowerCase();let out=records.filter(r=>(filter==='Alles'||r.format===filter)&&((r.artist+' '+r.title).toLowerCase().includes(q)));document.getElementById('count').textContent=out.length+' van '+records.length+' platen';document.getElementById('list').innerHTML=out.map(r=>`<div class="card"><div class="info"><div class="artist">${esc(r.artist||'Onbekende artiest')}</div><div class="title">${esc(r.title)}</div><div class="meta">${esc(r.format)} · Gewassen: ${esc(r.washed)}</div></div><div class="actions"><button onclick="editRecord(${r.id})">✏️</button><button onclick="deleteRecord(${r.id})">🗑️</button></div></div>`).join('')||'<div class="card">Geen platen gevonden.</div>'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function filters(){let fs=['Alles','LP','2LP','3LP','4LP','6LP','12"','RSD','New'];document.getElementById('filters').innerHTML=fs.map(f=>`<button class="${filter===f?'active':''}" onclick="filter='${f.replace('"','&quot;')}';filters();render()">${f}</button>`).join('')}function openForm(r=null){document.getElementById('modal').classList.add('show');document.getElementById('formTitle').textContent=r?'Plaat bewerken':'Plaat toevoegen';document.getElementById('editId').value=r?r.id:'';document.getElementById('artist').value=r?r.artist:'';document.getElementById('title').value=r?r.title:'';document.getElementById('format').value=r?r.format:'LP';document.getElementById('washed').value=r?r.washed:'Ja';setTimeout(()=>document.getElementById('artist').focus(),100)}function closeForm(){document.getElementById('modal').classList.remove('show')}function saveRecord(){let id=document.getElementById('editId').value;let data={artist:document.getElementById('artist').value.trim(),title:document.getElementById('title').value.trim(),format:document.getElementById('format').value,washed:document.getElementById('washed').value};if(!data.title){alert('Vul een titel in.');return}if(id){let r=records.find(x=>x.id==id);Object.assign(r,data)}else records.unshift({id:Date.now(),...data});persist();closeForm();render()}function editRecord(id){let r=records.find(x=>x.id===id);openForm(r)}function deleteRecord(id){let r=records.find(x=>x.id===id);if(confirm('Wil je “'+r.title+'” verwijderen?')){records=records.filter(x=>x.id!==id);persist();render()}}document.getElementById('search').addEventListener('input',render);filters();render();
</script></body></html>
